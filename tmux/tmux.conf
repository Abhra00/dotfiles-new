# --------------------#
#      Options        #
# --------------------#

# Setting Terminal Colors
set-option -g default-terminal tmux-256color
set -as terminal-features ",tmux-256color:RGB"

# Setting basic options
set -g mouse on
set -g set-clipboard on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# --------------------#
#      Keybinds       #
# --------------------#

# Setting prefix key
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Window split keybinds (opens in same directory as current pane)
unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Smart pane select
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# pane resize
bind -r Left  resize-pane -L 5
bind -r Down  resize-pane -D 5
bind -r Up    resize-pane -U 5
bind -r Right resize-pane -R 5

# Pane select
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Alt+number to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Display lazygit
bind -r g display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit

# Vim-like copy/paste
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# ----------------------#
#      Status Bar       #
# ----------------------#
# ----------------------#
#      Status Bar       #
# ----------------------#
set -g mode-style "fg=#7aa2f7,bg=#3b4261"
set -g message-style "fg=#7aa2f7,bg=#3b4261"
set -g message-command-style "fg=#7aa2f7,bg=#3b4261"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#7aa2f7,bg=#16161e"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE


# Status left
set -g status-left "\
#{?client_prefix,#[bg=#ff9e64],#[bg=#7aa2f7]}\
#[fg=#15161e,bold]  #S:#I.#P \
#{?client_prefix,#[fg=#ff9e64],#[fg=#7aa2f7]}\
#[bg=#16161e,nobold,nounderscore,noitalics]"

set -g status-right "#[fg=#ff007c,bg=#16161e,nobold,nounderscore,noitalics]#[fg=#16161e,bg=#ff007c]#[fg=#7dcfff,bg=#ff007c,nobold,nounderscore,noitalics]#[fg=#16161e,bg=#7dcfff]#[fg=#ff9e64,bg=#7dcfff,nobold,nounderscore,noitalics]#[fg=#ff007c,bg=#ff9e64]#[fg=#c0caf5,bg=#ff9e64,nobold,nounderscore,noitalics]#[fg=#16161e,bg=#c0caf5,bold] #h "

setw -g window-status-activity-style "underscore,fg=#c0caf5,bg=#16161e"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#c0caf5,bg=#16161e"
setw -g window-status-format '#[fg=#16161e,bg=#16161e]#[default] #I  #{b:pane_current_path} #[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]'
setw -g window-status-current-format '#[fg=#16161e,bg=#c0caf5]#[fg=#16161e,bg=#c0caf5] #I #[fg=#c0caf5,bg=#e0af68] #[fg=#16161e,bg=#e0af68]#{b:pane_current_path} #[fg=#e0af68,bg=#16161e,nobold]'
