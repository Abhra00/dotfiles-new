#    ┏┓┏┳┓┏┓┳┓┏┓┓┏┳┏┓
#    ┗┓ ┃ ┣┫┣┫┗┓┣┫┃┃┃
#    ┗┛ ┻ ┛┗┛┗┗┛┛┗┻┣┛
#

add_newline = true
command_timeout = 200
format = "[$directory$git_branch$git_status]($style)$character"

[character]
error_symbol = "[❯](bright-red)"
success_symbol = "[❯](bright-green)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
style = "bright-blue"
repo_root_style = "bright-purple"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic bright-cyan"

[git_status]
format     = '[$all_status$ahead_behind]($style)'
style      = "bright-purple"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = " "
staged     = "󰛄 "
renamed    = "» "
deleted    = "✘ "
