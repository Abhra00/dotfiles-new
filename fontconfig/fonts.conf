<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Sans-serif → ComicNeue -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>ComicNeue</string>
    </edit>
  </match>
  <!-- Serif → ComicNeue -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>serif</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>ComicNeue</string>
    </edit>
  </match>
  <!-- Monospace → Intel One Mono -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Intel One Mono</string>
    </edit>
  </match>
  <!-- Fallbacks for Unicode & emoji -->
  <alias>
    <family>ComicNeue</family>
    <prefer>
      <family>ComicNeue</family>
      <family>Noto Sans</family>
      <family>Noto Color Emoji</family>
      <family>ComicNeue Symbols</family>
    </prefer>
  </alias>
  <!-- System / UI aliases -->
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>ComicNeue</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>ui-sans-serif</family>
    <prefer>
      <family>ComicNeue</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>ui-serif</family>
    <prefer>
      <family>ComicNeue</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>ui-monospace</family>
    <prefer>
      <family>Intel One Mono</family>
    </prefer>
  </alias>
  <alias>
    <family>-apple-system</family>
    <prefer>
      <family>ComicNeue</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>BlinkMacSystemFont</family>
    <prefer>
      <family>ComicNeue</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
</fontconfig>
