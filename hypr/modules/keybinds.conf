#  ┓┏┓┏┓┓┏┳┓┳┳┓┳┓┏┓
#  ┃┫ ┣ ┗┫┣┫┃┃┃┃┃┗┓
#  ┛┗┛┗┛┗┛┻┛┻┛┗┻┛┗┛
#

$deskScripts = $HOME/.config/hypr/scripts
$mainMod = SUPER

# ── apps ──────────────────────────────────────────────────────────────────────
bindd = $mainMod,       Return,   Terminal,          exec, $terminal
bindd = $mainMod,       E,        Editor,            exec, $editor
bindd = $mainMod,       F,        File manager,      exec, $fileManager
bindd = $mainMod,       B,        Browser,           exec, $browser
bindd = $mainMod,       D,        App launcher,      exec, $appLauncher
bindd = $mainMod,       R,        Screen recorder,   exec, $recordingApplication
bindd = $mainMod SHIFT, V,        Volume control,    exec, $volumecontrol
bindd = $mainMod CTRL,  I,        Process monitor,   exec, $processmonitor
bindd = $mainMod SHIFT, Q,        Power menu,        exec, $deskScripts/powerMenu.sh

# ── web apps ──────────────────────────────────────────────────────────────────
bindd = SUPER ALT, 1, ChatGPT,         exec, $deskScripts/webAppLaunch.sh "https://chatgpt.com"
bindd = SUPER ALT, 2, Grok,            exec, $deskScripts/webAppLaunch.sh "https://grok.com"
bindd = SUPER ALT, 3, Google Drive,    exec, $deskScripts/webAppLaunch.sh "https://drive.google.com/drive/my-drive"
bindd = SUPER ALT, 4, Gmail,           exec, $deskScripts/webAppLaunch.sh "https://mail.google.com/mail"
bindd = SUPER ALT, 5, YouTube,         exec, $deskScripts/webAppLaunch.sh "https://youtube.com"
bindd = SUPER ALT, 6, WhatsApp,        exec, $deskScripts/webAppLaunch.sh "https://web.whatsapp.com"
bindd = SUPER ALT, 7, Google Messages, exec, $deskScripts/webAppLaunch.sh "https://messages.google.com/web/conversations"
bindd = SUPER ALT, 8, X,               exec, $deskScripts/webAppLaunch.sh "https://x.com"
bindd = SUPER ALT, 9, X compose,       exec, $deskScripts/webAppLaunch.sh "https://x.com/compose/post"

# ── focus (hjkl) ──────────────────────────────────────────────────────────────
bindd = $mainMod, H, Focus left,  movefocus, l
bindd = $mainMod, L, Focus right, movefocus, r
bindd = $mainMod, K, Focus up,    movefocus, u
bindd = $mainMod, J, Focus down,  movefocus, d

# ── window ────────────────────────────────────────────────────────────────────
bindd = $mainMod,       Q,      Kill window,         killactive
bindd = $mainMod ALT,   Q,      Kill process,        exec, $deskScripts/killActiveProcess.sh
bindd = $mainMod CTRL,  F,      Fullscreen,          fullscreen
bindd = $mainMod SHIFT, F,      Toggle floating,     togglefloating
bindd = $mainMod ALT,   F,      All windows float,   exec, hyprctl dispatch workspaceopt allfloat
bindd = $mainMod,       G,      Toggle group,        togglegroup
bindd = $mainMod CTRL,  Tab,    Cycle group focus,   changegroupactive
bindd = ALT SHIFT,      Tab,    Cycle all windows,   cyclenext
bindd = ALT CTRL,       Tab,    Bring float to top,  bringactivetotop

# ── dwindle layout ────────────────────────────────────────────────────────────
bindd = $mainMod SHIFT, I, Toggle split,      exec, hyprctl dispatch layoutmsg togglesplit
bindd = $mainMod,       P, Toggle pseudotile, pseudo
bindd = $mainMod SHIFT, P, Move to root,      layoutmsg, movetoroot active unstable
bindd = $mainMod,       M, Increase split,    exec, hyprctl dispatch splitratio 0.3

# ── master layout ─────────────────────────────────────────────────────────────
bindd = $mainMod,       I,      Add master,        layoutmsg, addmaster
bindd = $mainMod CTRL,  D,      Remove master,     layoutmsg, removemaster
bindd = $mainMod,       H,      Focus prev,        layoutmsg, cycleprev
bindd = $mainMod,       L,      Focus next,        layoutmsg, cyclenext
bindd = $mainMod CTRL,  Return, Swap with master,  layoutmsg, swapwithmaster

# ── scrolling layout ──────────────────────────────────────────────────────────
bindd = $mainMod ALT,   Return, Move col right,    layoutmsg, move +col
bindd = $mainMod ALT,   Left,   Swap col left,     layoutmsg, swapcol l
bindd = $mainMod ALT,   Right,  Swap col right,    layoutmsg, swapcol r


# ── cycle through layouts ──────────────────────────────────────────────────────────
bindd = $mainMod, Space, Cycle through layouts, exec, $deskScripts/cycleLayout.sh

# ── workspaces ────────────────────────────────────────────────────────────────
bindd = $mainMod, 1, Workspace 1,  workspace, 1
bindd = $mainMod, 2, Workspace 2,  workspace, 2
bindd = $mainMod, 3, Workspace 3,  workspace, 3
bindd = $mainMod, 4, Workspace 4,  workspace, 4
bindd = $mainMod, 5, Workspace 5,  workspace, 5
bindd = $mainMod, 6, Workspace 6,  workspace, 6
bindd = $mainMod, 7, Workspace 7,  workspace, 7
bindd = $mainMod, 8, Workspace 8,  workspace, 8
bindd = $mainMod, 9, Workspace 9,  workspace, 9
bindd = $mainMod, 0, Workspace 10, workspace, 10

# move window to workspace
bindd = $mainMod SHIFT, 1, Move to ws 1,  movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Move to ws 2,  movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Move to ws 3,  movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Move to ws 4,  movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Move to ws 5,  movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Move to ws 6,  movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Move to ws 7,  movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Move to ws 8,  movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Move to ws 9,  movetoworkspace, 9
bindd = $mainMod SHIFT, 0, Move to ws 10, movetoworkspace, 10

# move window silently to workspace
bindd = SUPER SHIFT ALT, 1, Silent move to ws 1,  movetoworkspacesilent, 1
bindd = SUPER SHIFT ALT, 2, Silent move to ws 2,  movetoworkspacesilent, 2
bindd = SUPER SHIFT ALT, 3, Silent move to ws 3,  movetoworkspacesilent, 3
bindd = SUPER SHIFT ALT, 4, Silent move to ws 4,  movetoworkspacesilent, 4
bindd = SUPER SHIFT ALT, 5, Silent move to ws 5,  movetoworkspacesilent, 5
bindd = SUPER SHIFT ALT, 6, Silent move to ws 6,  movetoworkspacesilent, 6
bindd = SUPER SHIFT ALT, 7, Silent move to ws 7,  movetoworkspacesilent, 7
bindd = SUPER SHIFT ALT, 8, Silent move to ws 8,  movetoworkspacesilent, 8
bindd = SUPER SHIFT ALT, 9, Silent move to ws 9,  movetoworkspacesilent, 9
bindd = SUPER SHIFT ALT, 0, Silent move to ws 10, movetoworkspacesilent, 10

# scratchpad
bindd = $mainMod,       S, Toggle scratchpad,      togglespecialworkspace, magic
bindd = $mainMod SHIFT, S, Move to scratchpad,     movetoworkspace, special:magic

# scroll through workspaces
bindd = $mainMod CTRL, mouse_down, Next workspace, workspace, e+1
bindd = $mainMod CTRL, mouse_up,   Prev workspace, workspace, e-1

# ── opacity ───────────────────────────────────────────────────────────────────
bindd = $mainMod,       BRACKETRIGHT, Opacity up,     exec, $deskScripts/dynamicOpacityChanger.sh up
bindd = $mainMod,       BRACKETLEFT,  Opacity down,   exec, $deskScripts/dynamicOpacityChanger.sh down
bindd = $mainMod SHIFT, BRACKETRIGHT, Opacity toggle, exec, $deskScripts/dynamicOpacityChanger.sh toggle

# ── wallpaper ─────────────────────────────────────────────────────────────────
bindd = $mainMod,     W,   Cycle wallpaper,    exec, $deskScripts/cycleWall.sh
bindd = $mainMod ALT, W,   Wallpaper selector, exec, $deskScripts/wallSelect.sh

# ── ui ────────────────────────────────────────────────────────────────────────
bindd = $mainMod ALT,  B, Toggle waybar,   exec, pkill -SIGUSR1 waybar
bindd = $mainMod ALT,  R, Refresh ui,      exec, $deskScripts/refresh.sh

# ── rofi ──────────────────────────────────────────────────────────────────────
bindd = $mainMod CTRL,  V,         Clipboard,       exec, $deskScripts/cliphist.sh
bindd = $mainMod,       SEMICOLON, Emoji picker,    exec, $deskScripts/emojiPicker.sh
bindd = $mainMod SHIFT, K,         Keybind help,    exec, $deskScripts/rofiKeybindCheatSheet.sh
bindd = ALT,            TAB,       Window switcher, exec, $deskScripts/windowSwitcher.sh

# ── mako notifications ────────────────────────────────────────────────────────
bindd = $mainMod,       Z, Dismiss notification,          exec, makoctl dismiss
bindd = $mainMod SHIFT, Z, Dismiss all notifications,     exec, makoctl dismiss --all
bindd = $mainMod,       X, Open motification action menu, exec, makoctl menu -- rofi -dmenu -theme ~/.config/rofi/notification.rasi
bindd = $mainMod SHIFT, X, Toggle do not disturb,         exec, $deskScripts/toggleDnd.sh
bindd = $mainMod,       C, Restore last notification,     exec, makoctl restore

# ── screenshot ────────────────────────────────────────────────────────────────
bindd = , Print, Screenshot, exec, $deskScripts/screenshot.sh

# ── mouse ─────────────────────────────────────────────────────────────────────
bindmd = $mainMod, mouse:272, Move window,   movewindow
bindmd = $mainMod, mouse:273, Resize window, resizewindow

# zoom
bindd = $mainMod,       mouse_down, Zoom in,    exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 + 0.5}')
bindd = $mainMod,       mouse_up,   Zoom out,   exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 - 0.5}')
bindd = $mainMod SHIFT, mouse_up,   Reset zoom, exec, hyprctl keyword cursor:zoom_factor 1

# ── media & volume ────────────────────────────────────────────────────────────
bindld = , XF86AudioRaiseVolume,  Volume up,        exec, $deskScripts/volume-osd.sh up
bindld = , XF86AudioLowerVolume,  Volume down,      exec, $deskScripts/volume-osd.sh down
bindld = , XF86AudioMute,         Mute toggle,      exec, $deskScripts/volume-osd.sh mute-toggle
bindld = , XF86AudioMicMute,      Mic mute toggle,  exec, $deskScripts/volume-osd.sh mic-toggle
bindld = , XF86MonBrightnessUp,   Brightness up,    exec, $deskScripts/brightness-osd.sh up
bindld = , XF86MonBrightnessDown, Brightness down,  exec, $deskScripts/brightness-osd.sh down
bindld = , XF86AudioNext,         Next track,       exec, $deskScripts/media-osd.sh next
bindld = , XF86AudioPause,        Pause,            exec, $deskScripts/media-osd.sh pause
bindld = , XF86AudioPlay,         Play,             exec, $deskScripts/media-osd.sh play
bindld = , XF86AudioPrev,         Prev track,       exec, $deskScripts/media-osd.sh prev

# ── system ────────────────────────────────────────────────────────────────────
bindd = CTRL ALT, Delete, Exit Hyprland, exec, hyprctl dispatch exit 0
