<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- ================= Sans-serif ================= -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend_first" binding="same">
      <string>Source Sans 3</string>
      <string>Noto Sans</string>
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans Symbols</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <!-- ================= Serif ================= -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend_first" binding="same">
      <string>Source Serif 4</string>
      <string>Noto Serif</string>
      <string>Noto Serif CJK SC</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <!-- ================= Monospace ================= -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend_first" binding="same">
      <string>Source Code Pro</string>
      <string>Noto Sans Mono</string>
      <string>Noto Sans Symbols</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <!-- ================= System UI aliases ================= -->
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Source Sans 3</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>ui-sans-serif</family>
    <prefer>
      <family>Source Sans 3</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>ui-serif</family>
    <prefer>
      <family>Source Serif 4</family>
      <family>Noto Serif</family>
    </prefer>
  </alias>
  <alias>
    <family>ui-monospace</family>
    <prefer>
      <family>Source Code Pro</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>
  <!-- macOS compatibility aliases -->
  <alias>
    <family>-apple-system</family>
    <prefer>
      <family>Source Sans 3</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>BlinkMacSystemFont</family>
    <prefer>
      <family>Source Sans 3</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <!-- ================= Emoji fallback ================= -->
  <alias>
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
