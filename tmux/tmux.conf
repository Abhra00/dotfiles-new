# --------------------#
#      Options        #
# --------------------#

# Setting Terminal Colors
set-option -g default-terminal tmux-256color
set -as terminal-features ",tmux-256color:RGB"

# For kitty graphics protocol to work
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Setting basic options
set -g mouse on
set -g set-clipboard on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# --------------------#
#      Keybinds       #
# --------------------#

# Setting prefix key
unbind C-b
set -g prefix `
bind-key ` send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Window split keybinds (opens in same directory as current pane)
unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Smart pane select
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# pane resize
bind -r Left  resize-pane -L 5
bind -r Down  resize-pane -D 5
bind -r Up    resize-pane -U 5
bind -r Right resize-pane -R 5

# Pane select
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Alt+number to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Display lazygit
bind -r g display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit

# Vim-like copy/paste
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# ----------------------#
#         Theme         #
# ----------------------#
# default statusbar colors
set-option -g status-style bg=colour235,fg=colour136,default
# default window title colors
set-window-option -g window-status-style fg=colour244,bg=colour234,dim
# active window title colors
set-window-option -g window-status-current-style fg=colour166,bg=default,bright
# pane border
set-option -g pane-border-style fg=colour235 #base02
set-option -g pane-active-border-style fg=colour136,bg=colour235
# message text
set-option -g message-style bg=colour235,fg=colour166
# pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour166 #orange
# clock
set-window-option -g clock-mode-colour colour64 #green

# ----------------------#
#      Status Bar       #
# ----------------------#
set -g mode-style "fg=#7f91b2,bg=#4d463e"
set -g message-style "fg=#7f91b2,bg=#4d463e"
set -g message-command-style "fg=#7f91b2,bg=#4d463e"
set -g pane-border-style "fg=#4d463e"
set -g pane-active-border-style "fg=#7f91b2"
set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#7f91b2,bg=#141210"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE

# Status left
set -g status-left "\
#{?client_prefix,#[bg=#c09d59],#[bg=#7f91b2]}\
#[fg=#141210,bold]  #S:#I.#P \
#{?client_prefix,#[fg=#c09d59],#[fg=#7f91b2]}\
#[bg=#141210,nobold,nounderscore,noitalics] "

# Status right
set -g status-right "#[fg=#b380b0]  #W #[fg=#c09d59]  #h "

# Window status format - fixed background
set -g window-status-format '#[bg=#141210,fg=#4d463e,nobold]⬤ '
set -g window-status-current-format '#[bg=#141210,fg=#7f91b2,nobold]⬤ '

# Update status bar every 60 seconds
set -g status-interval 60

# Status lengths
set -g status-left-length 40
set -g status-right-length 40
