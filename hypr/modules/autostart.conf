# ┏┓┳┳┏┳┓┏┓┏┓┏┳┓┏┓┳┓┏┳┓
# ┣┫┃┃ ┃ ┃┃┗┓ ┃ ┣┫┣┫ ┃
# ┛┗┗┛ ┻ ┗┛┗┛ ┻ ┛┗┛┗ ┻

#-----------------XDPH-----------------#
#--------------------------------------#
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

#-----------clipboard manager------------#
#----------------------------------------#
exec-once = wl-clip-persist --clipboard regular --all-mime-type-regex '^(?!x-kde-passwordManagerHint).+' # Persistent clipboard
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data

#-----------fcitx5------------#
#-----------------------------#
exec-once = fcitx5 -d

#-------------idling system------------#
#--------------------------------------#
exec-once = hypridle

#-------------bar, wallpaper,osd & notification daemon--------------#
#-------------------------------------------------------------------#
exec-once = hyprpaper
exec-once = sleep 3 && hyprctl dispatch exec waybar
exec-once = swaync
exec-once = swayosd-server

#--------------applets---------------#
#------------------------------------#
exec-once = python3 $HOME/.config/hypr/scripts/blue_tray.py
exec-once = nm-applet

#-----------authentication agent------------#
#-------------------------------------------#
exec-once = systemctl --user start hyprpolkitagent
