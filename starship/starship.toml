# A Simple yet elegant starship config
# Created by BUGS

# Schema
"$schema" = 'https://starship.rs/config-schema.json'

# Options
add_newline = true
command_timeout = 200

# Black Pine — Starship theme
# • → [dir:branch status]

format = """$character [↬](3 bold) [\\[](1 bold)$directory$git_branch$git_status[\\]](1 bold) """

[character]
format = "$symbol "
success_symbol = "[](2)"
error_symbol = "[](1)"
vimcmd_symbol = "[󰥱](2)"
vimcmd_visual_symbol = "[󰥱](5)"
vimcmd_replace_symbol = "[󰥱](3)"
vimcmd_replace_one_symbol = "[󰥱](4)"

[directory]
style = "15"
read_only_style = "9"
home_symbol = "HOME"
read_only = " "
truncation_length = 2
truncation_symbol = "…/"
truncate_to_repo = true
format = "[ $path ]($style)[$read_only]($read_only_style)"

[git_branch]
symbol = " "
style = "4"
format = "[$symbol$branch]($style)"

[git_status]
style = "3"
staged = "[+](2)"
modified = "[◎](3)"
untracked = "[?](8)"
deleted = "[✘](1)"
renamed = "[»](6)"
ahead = "[⇡](4)"
behind = "[⇣](1)"
diverged = "[⇕](3)"
conflicted = "[═](1)"
up_to_date = "[✦](2)"
format = " [$all_status$ahead_behind]($style) "

[golang]
disabled = true
[nodejs]
disabled = true
[python]
disabled = true
[rust]
disabled = true
