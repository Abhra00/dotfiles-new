#--------------floating window rules-------------------#
#------------------------------------------------------#
# Floating window tag
windowrule = match:class (com.gabm.satty|About|swayimg|thunara|blueman-manager|nwg-look), tag +floating-window
windowrule = match:title (Kvantum Manager), tag +floating-window
windowrule = match:class (xdg-desktop-portal-gtk|DesktopEditors|thunar), match:title ^(Open.*Files?|Open [F|f]older.*|Save.*Files?|Save.*As|Save|All Files|.*wants to [open|save].*|[C|c]hoose.*|[R|r]ename.*), tag +floating-window

# Floating window size and state
windowrule = match:tag floating-window, float on
windowrule = match:tag floating-window, center on
windowrule = match:tag floating-window, size 875 600

# Floating window opacity
windowrule = match:tag floating-window, opacity 0.98 0.95

#--------------media window rules-------------------#
#---------------------------------------------------#
windowrule = match:class ^(zoom|mpv|com.obsproject.Studio|swayimg)$, opacity 1.0 1.0

# Popped window rounding
windowrule = match:tag pop, rounding 8
