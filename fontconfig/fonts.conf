<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- ================= Sans-serif ================= -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend_first" binding="same">
      <string>Aporetic Sans</string>
      <string>Noto Sans</string>
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans Symbols</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- ================= Serif ================= -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend_first" binding="same">
      <string>Aporetic Serif</string>
      <string>Noto Serif</string>
      <string>Noto Serif CJK SC</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- ================= Monospace ================= -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend_first" binding="same">
      <string>Aporetic Sans Mono</string>
      <string>Noto Sans Mono</string>
      <string>Noto Sans Symbols</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- ================= UI aliases ================= -->
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Aporetic Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>ui-sans-serif</family>
    <prefer>
      <family>Aporetic Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>ui-serif</family>
    <prefer>
      <family>Aporetic Serif</family>
      <family>Noto Serif</family>
    </prefer>
  </alias>

  <alias>
    <family>ui-monospace</family>
    <prefer>
      <family>Aporetic Sans Mono</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <!-- macOS compatibility -->
  <alias>
    <family>-apple-system</family>
    <prefer>
      <family>Aporetic Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>BlinkMacSystemFont</family>
    <prefer>
      <family>Aporetic Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <!-- Emoji -->
  <alias>
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

</fontconfig>
