# Main mpv theme options
background-color='#141b1e'
osd-back-color='#232a2d'
osd-border-color='#232a2d'
osd-color='#67b0e8'
osd-shadow-color='#141b1e'

# OSD font
osd-font=Lilex Bold
osd-font-size=28

# Subtitles
sub-font=Noto Sans
sub-font-size=36
sub-bold=yes
sub-border-size=2
sub-border-color=0.0/0.0/0.0/1.0
sub-shadow-offset=1
sub-shadow-color=0.0/0.0/0.0/0.6
sub-ass-style-overrides=Kerning=yes
