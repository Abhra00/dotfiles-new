# Main mpv theme options
background-color='#0e151a'
osd-back-color='#151f26'
osd-border-color='#151f26'
osd-color='#baa0e8'
osd-shadow-color='#0e151a'


# OSD font
osd-font=Rubik
osd-font-size=28

# Subtitles
sub-font=Noto Sans
sub-font-size=36
sub-bold=yes
sub-border-size=2
sub-border-color=0.0/0.0/0.0/1.0
sub-shadow-offset=1
sub-shadow-color=0.0/0.0/0.0/0.6
sub-ass-style-overrides=Kerning=yes
