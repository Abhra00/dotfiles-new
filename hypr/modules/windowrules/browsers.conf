#    ┻┛┛┗┗┛┗┻┛┗┛┗┛┛┗┗┛  ┗┻┛┻┛┗┻┛┗┛┗┻┛┛┗┗┛┗┛┗┛┗┛
#

#--------------------browser types--------------------#
#-----------------------------------------------------#
windowrule = match:class ([cC]hrom(e|ium)|[bB]rave-browser|Microsoft-edge|Vivaldi-stable), tag +chromium-based-browser
windowrule = match:class (Firefox|zen|librewolf), tag +firefox-based-browser

#---------force chromium-based browsers into a tile to deal with --app bug--------------#
#---------------------------------------------------------------------------------------#
windowrule = match:tag chromium-based-browser, tile on

#--------------opacity rule---------#
#-----------------------------------#
windowrule = match:tag chromium-based-browser, opacity 1 0.95
windowrule = match:tag firefox-based-browser, opacity 1 0.95

#---------no transparency on video sites------------#
#---------------------------------------------------#
windowrule = match:title ^(?i).*(youtube|twitch|zoom|netflix|primevideo|disney).*, opacity 1.0 1.0
