#  ┓┏┓┏┏┓┳┓┓ ┏┓┏┓┓┏┓
#  ┣┫┗┫┃┃┣┫┃ ┃┃┃ ┃┫
#  ┛┗┗┛┣┛┛┗┗┛┗┛┗┛┛┗┛
#

# Colors
$BG_COLOR = rgba(141210FF)
$BG_TRANSPARENT_COLOR = rgba(141210BB)
$FG_COLOR = rgba(e5c9a0FF)
$FG_INVERSE_COLOR = rgba(141210FF)
$ACCENT_COLOR = rgba(d8834cFF)
$SUCCESS_COLOR = rgba(78997aFF)
$ERROR_COLOR = rgba(c06c5cFF)
$WARNING_COLOR = rgba(c09d59FF)
$SHADOW_COLOR = rgba(141210AA)

# Fonts
$FONT_FAMILY = JetBrains Mono
$FONT_FAMILY_STYLISTIC = Playwrite AT
$FONT_FAMILY_SYMBOLS = Material Symbols Rounded

# Image
$IMAGE = $HOME/.local/share/hyprlock_bg

# General
general {
    grace = 1
    hide_cursor = true
    immediate_render = true
    ignore_empty_input = true
    text_trim = false
}

# Authentication
auth {
    pam {
        enabled = true
        module = hyprlock
    }
    fingerprint {
        enabled = false
    }
}

# Animations
animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 5, linear
}

# Background
background {
    path = $IMAGE
    blur_size = 2
    blur_passes = 3
    zindex = -1
}

# Input Field
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    rounding = 0
    dots_size = 0.1
    dots_spacing = 0.3
    dots_rounding = 0
    dots_center = true
    font_family = $FONT_FAMILY
    placeholder_text = Enter Password 󰌾
    fail_text = <i>$PAMFAIL ($ATTEMPTS)</i>
    outer_color = $FG_COLOR
    inner_color = $BG_TRANSPARENT_COLOR
    check_color = $SUCCESS_COLOR
    fail_color = $ERROR_COLOR
    font_color = $FG_COLOR
    capslock_color = $WARNING_COLOR
    numlock_color = $ACCENT_COLOR
    bothlock_color = $ERROR_COLOR
    fade_on_empty = true
    position = 0, -150
    halign = center
    valign = center
    zindex = 10
}

# Clock/Time
label {
    monitor =
    text = $TIME
    color = $ACCENT_COLOR
    shadow_color = $SHADOW_COLOR
    font_size = 90
    shadow_passes = 3
    shadow_boost = 0.5
    font_family = $FONT_FAMILY
    position = 0, -100
    halign = center
    valign = top
    zindex = 3
}

# Date
label {
    monitor =
    text = cmd[update:18000000] date +'%A, %d %B'
    color = $FG_COLOR
    shadow_color = $SHADOW_COLOR
    font_size = 30
    shadow_passes = 3
    shadow_boost = 0.5
    font_family = $FONT_FAMILY_STYLISTIC
    position = 0, -250
    halign = center
    valign = top
    zindex = 3
}

# Big Rectangle
shape {
    monitor =
    size = 100%, 60
    color = $BG_COLOR
    halign = center
    valign = bottom
    zindex = 0
}

# Small Rectangle for Battery
shape {
    monitor =
    size = 85, 32
    rounding = 0
    color = $ACCENT_COLOR
    halign = right
    valign = bottom
    position = -14, 14
    zindex = 1
}

# Battery Status
label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/hyprlock/scripts/bat-status.sh
    shadow_passes = 1
    shadow_boost = 0.5
    color = $FG_INVERSE_COLOR
    shadow_color = $SHADOW_COLOR
    font_size = 14
    font_family = $FONT_FAMILY
    text_align = center
    position = -25, -11
    halign = right
    valign = bottom
    zindex = 2
}

# Small Rectangle For Session
shape {
    monitor =
    size = 250, 32
    rounding = 0
    color = $ACCENT_COLOR
    halign = center
    valign = bottom
    position = 0, 14
    zindex = 1
}

# Current Session
label {
    monitor =
    text = cmd[update:24000000] echo "Session : $XDG_SESSION_DESKTOP"
    color = $FG_INVERSE_COLOR
    shadow_color = $SHADOW_COLOR
    font_size = 12
    font_family = $FONT_FAMILY_STYLISTIC
    text_align = center
    position = 0, -10
    halign = center
    valign = bottom
    zindex = 2
}

# PFP Image
image {
    monitor =
    path = $HOME/.config/hypr/hyprlock/assets/pfp.png
    size = 100
    rounding = -1
    border_size = 3
    border_color = $ACCENT_COLOR
    position = 10, 10
    halign = left
    valign = bottom
    zindex = 3
}

# Username
label {
    monitor =
    text = $USER
    shadow_passes = 1
    shadow_boost = 0.5
    color = $ACCENT_COLOR
    shadow_color = $SHADOW_COLOR
    font_size = 14
    font_family = $FONT_FAMILY_STYLISTIC
    position = 120, 28
    halign = left
    valign = bottom
    zindex = 2
}

# Hostname
label {
    monitor =
    text = cmd[update:24000000] echo "@$(uname -n)"
    shadow_passes = 1
    shadow_boost = 0.5
    color = $FG_COLOR
    shadow_color = $FG_COLOR
    font_size = 14
    font_family = $FONT_FAMILY_STYLISTIC
    position = 120, -25
    halign = left
    valign = bottom
    zindex = 2
}

# Lock Icon
label {
    monitor =
    text = cmd[update:0] echo -e $'\uf8f3'
    shadow_passes = 1
    shadow_boost = 0.5
    color = $ACCENT_COLOR
    shadow_color = $SHADOW_COLOR
    font_size = 30
    font_family = $FONT_FAMILY_SYMBOLS
    position = 0, -65
    halign = center
    valign = top
    zindex = 2
}
