# Main mpv theme options
background-color='#1A1B26'
osd-back-color='#16161E'
osd-border-color='#16161E'
osd-color='#FF9E64'
osd-shadow-color='#1A1B26'

# OSD font
osd-font=Maple Mono CN
osd-font-size=28

# Subtitles
sub-font=Noto Sans
sub-font-size=36
sub-bold=yes
sub-border-size=2
sub-border-color=0.0/0.0/0.0/1.0
sub-shadow-offset=1
sub-shadow-color=0.0/0.0/0.0/0.6
sub-ass-style-overrides=Kerning=yes
