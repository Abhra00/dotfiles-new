#  ┓┏┓┏┏┓┳┓┓ ┏┓┏┓┓┏┓
#  ┣┫┗┫┃┃┣┫┃ ┃┃┃ ┃┫
#  ┛┗┗┛┣┛┛┗┗┛┗┛┗┛┛┗┛
#

# Colors
$BG_COLOR = rgba(0e151aFF)
$BG_TRANSPARENT_COLOR = rgba(0e151aBB)
$FG_COLOR = rgba(f6f6f5FF)
$FG_INVERSE_COLOR = rgba(0e151aFF)
$ACCENT_COLOR = rgba(baa0e8FF)
$SUCCESS_COLOR = rgba(87e58eFF)
$ERROR_COLOR = rgba(dd6e6bFF)
$WARNING_COLOR = rgba(e8eda2FF)
$SHADOW_COLOR = rgba(0e151aAA)

# Fonts
$FONT_FAMILY = Geist Mono Nerd Font Propo
$FONT_FAMILY_STYLISTIC = Major Mono Display

# Image
$IMAGE = $HOME/.local/share/hyprlock_bg

# General
general {
    grace = 1
    hide_cursor = true
    immediate_render = true
    ignore_empty_input = true
    text_trim = false
}

# Animations
animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 5, linear
}

# Background
background {
    path = $IMAGE
    blur_size = 2
    blur_passes = 3
    zindex = -1
}

# Input Field
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    rounding = 0
    dots_size = 0.1
    dots_spacing = 0.3
    dots_rounding = 0
    font_family = $FONT_FAMILY
    placeholder_text = Enter Password 󰌾
    fail_text = <i>$PAMFAIL ($ATTEMPTS)</i>
    outer_color = $FG_COLOR
    inner_color = $BG_TRANSPARENT_COLOR
    check_color = $SUCCESS_COLOR
    fail_color = $ERROR_COLOR
    font_color = $FG_COLOR
    capslock_color = $WARNING_COLOR
    numlock_color = $ACCENT_COLOR
    bothlock_color = $ERROR_COLOR
    fade_on_empty = true
    position = 0, -220
    halign = center
    valign = center
    zindex = 10
}

# CLOCK/TIME
label {
    monitor =
    text = $TIME
    color = $ACCENT_COLOR
    shadow_color = $SHADOW_COLOR
    font_size = 90
    shadow_passes = 3
    shadow_boost = 0.5
    font_family = $FONT_FAMILY_STYLISTIC
    position = 0, -100
    halign = center
    valign = top
    zindex = 3
}

# DATE
label {
    monitor =
    text = cmd[update:18000000] date +'%A,%d %b'
    color = $ACCENT_COLOR
    shadow_color = $SHADOW_COLOR
    font_size = 30
    shadow_passes = 3
    shadow_boost = 0.5
    font_family = $FONT_FAMILY_STYLISTIC
    position = 0, -250
    halign = center
    valign = top
    zindex = 3
}

# Big Rectangle
shape {
    monitor =
    size = 100%, 60
    color = $BG_COLOR
    halign = center
    valign = bottom
    zindex = 0
}

# Small Rectangle for Battery
shape {
    monitor =
    size = 70, 32
    rounding = 0
    color = $ACCENT_COLOR
    halign = right
    valign = bottom
    position = -14, 14
    zindex = 1
}

# Battery Status
label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/hyprlock/scripts/bat-status.sh
    shadow_passes = 1
    shadow_boost = 0.5
    color = $FG_INVERSE_COLOR
    shadow_color = $SHADOW_COLOR
    font_size = 14
    font_family = $FONT_FAMILY
    position = -21, -8
    halign = right
    valign = bottom
    zindex = 2
}

# Small Rectangle For Weather
shape {
    monitor =
    size = 400, 32
    rounding = 0
    color = $ACCENT_COLOR
    halign = center
    valign = bottom
    position = 0, 14
    zindex = 1
}

# Current Weather
label {
    monitor =
    text = cmd[update:24000000] echo "$(~/.config/hypr/hyprlock/scripts/weather.sh)"
    color = $FG_INVERSE_COLOR
    shadow_color = $SHADOW_COLOR
    font_size = 12
    font_family = $FONT_FAMILY
    position = 0, -3.5
    halign = center
    valign = bottom
    zindex = 2
}

# PFP Image
image {
    monitor =
    path = $HOME/.config/hypr/hyprlock/assets/pfp.png
    size = 100
    rounding = -1
    border_size = 3
    border_color = $ACCENT_COLOR
    position = 10, 10
    halign = left
    valign = bottom
    zindex = 3
}


# Username
label {
    monitor =
    text = $USER
    shadow_passes = 1
    shadow_boost = 0.5
    color = $ACCENT_COLOR
    shadow_color = $SHADOW_COLOR
    font_size = 14
    font_family = $FONT_FAMILY
    position = 120, 28
    halign = left
    valign = bottom
    zindex = 2
}

# Hostname
label {
    monitor =
    text = cmd[update:24000000] echo "@$(uname -n)"
    shadow_passes = 1
    shadow_boost = 0.5
    color = $FG_COLOR
    shadow_color = $FG_COLOR
    font_size = 14
    font_family = $FONT_FAMILY
    position = 120, -20
    halign = left
    valign = bottom
    zindex = 2
}

# Lock Icon
label {
    monitor =
    text = 
    shadow_passes = 1
    shadow_boost = 0.5
    color = $ACCENT_COLOR
    shadow_color = $SHADOW_COLOR
    font_size = 20
    font_family = $FONT_FAMILY
    position = 0, -65
    halign = center
    valign = top
    zindex = 2
}
# PLAYER IMAGE
image {
    monitor =
    path = $HOME/.config/hypr/hyprlock/assets/music.png
    size = 40
    rounding = 0
    border_size = 0
    rotate = 0
    reload_time = 2
    reload_cmd = ~/.config/hypr/hyprlock/scripts/music-stats.sh --arturl
    position = -106, 0
    halign = center
    valign = center
    zindex = 1
}

# PLAYER BOX
shape {
    monitor =
    color = $BG_TRANSPARENT_COLOR
    size = 300, 84
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

# PLAYER TITTLE
label {
    monitor =
    text = cmd[update:1000] echo " $(~/.config/hypr/hyprlock/scripts/music-stats.sh --title)"
    color = $ACCENT_COLOR
    font_size = 14
    font_family = $FONT_FAMILY
    position = 50, -12
    halign = center
    valign = center
    zindex = 1
}

# PLAYER STATUS
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/hyprlock/scripts/music-stats.sh --status)"
    color = $ACCENT_COLOR
    font_size = 16
    font_family = $FONT_FAMILY
    position = -50, -15
    halign = center
    valign = center
    zindex = 1
}

# PLAYER SOURCE
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/hyprlock/scripts/music-stats.sh --source)"
    color = $ACCENT_COLOR
    font_size = 14
    font_family = $FONT_FAMILY
    position = 0, 10
    halign = center
    valign = center
    zindex = 1
}

# PLAYER Artist
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/hyprlock/scripts/music-stats.sh --artist)"
    color = $ACCENT_COLOR
    font_size = 14
    font_family = $FONT_FAMILY
    position = 25, -35
    halign = center
    valign = center
    zindex = 1
}
