#--------------------------------------- cursors ---------------------------------------------#
#---------------------------------------------------------------------------------------------#
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24

#--------------------------- toolkit backend / graphics setup --------------------------------#
#---------------------------------------------------------------------------------------------#
env = CLUTTER_BACKEND,wayland
env = GDK_BACKEND,wayland,x11,*                 # backend priority
env = GDK_SCALE,1                               # keep 1 unless scaling issues

#----------------------------------- xdg specifications --------------------------------------#
#---------------------------------------------------------------------------------------------#
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

#--------------------------------------- qt variables ----------------------------------------#
#---------------------------------------------------------------------------------------------#
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_SCALE_FACTOR,1
env = QT_QPA_PLATFORM,wayland;xcb               # Wayland first, fallback to XCB
env = QT_QPA_PLATFORMTHEME,hyprqt6engine        # theming via hyprqt6engine
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QUICK_CONTROLS_STYLE,org.hyprland.style

#----------------------------------------- firefox -------------------------------------------#
#---------------------------------------------------------------------------------------------#
env = MOZ_ENABLE_WAYLAND,1

#-------------------------------- electron / ozone platform ----------------------------------#
#---------------------------------------------------------------------------------------------#
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = OZONE_PLATFORM,wayland

#------------------------------------------- SDL2 --------------------------------------------#
#---------------------------------------------------------------------------------------------#
# Enable only if SDL2 games behave properly
# env = SDL_VIDEODRIVER,wayland

#----------------------------------------- fcitx5 IME ----------------------------------------#
#---------------------------------------------------------------------------------------------#
env = INPUT_METHOD,fcitx
env = GLFW_IM_MODULE,fcitx

#--------------------------- nvidia hardware specific variables ------------------------------#
#---------------------------------------------------------------------------------------------#
# Uncomment ONLY IF you are using NVIDIA GPU
# env = WLR_NO_HARDWARE_CURSORS,1
# env = LIBVA_DRIVER_NAME,nvidia
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = GBM_BACKEND,nvidia-drm
# env = __NV_PRIME_RENDER_OFFLOAD,1
# env = __VK_LAYER_NV_optimus,NVIDIA_only
# env = WLR_DRM_NO_ATOMIC,1
# env = NVD_BACKEND,direct
# env = MOZ_DISABLE_RDD_SANDBOX,1
# env = EGL_PLATFORM,wayland


#-------------------------------- software rendering / VM ------------------------------------#
#---------------------------------------------------------------------------------------------#
# Uncomment in VM or software fallback conditions
# env = WLR_RENDERER_ALLOW_SOFTWARE,1
