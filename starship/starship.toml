# A Simple yet elegant starship config
# Created by BUGS

# Schema
"$schema" = 'https://starship.rs/config-schema.json'

# Options
add_newline = true
command_timeout = 200

# Prompt left format
format = """
[λ](bright-purple) $directory \
$git_branch \
$git_status
$character
"""

# Character
[character]
format = "$symbol "
success_symbol = "[[└](dimmed) ❯](bold bright-green)"
error_symbol = "[[└](dimmed) ❯](bold bright-red)"

# Directory
[directory]
style = "bright-white"
read_only_style = "red"
home_symbol = "home"
read_only = " "
truncation_length = 1
truncation_symbol = "…/"
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style)"

# Git branch
[git_branch]
style = "blue"
symbol = " "
format = "[[● ](dimmed bright-black)$symbol$branch]($style)"

# Git status
[git_status]
stashed = "≡"
up_to_date = ""
format = "[$all_status$ahead_behind]($style)"
style = "red"
