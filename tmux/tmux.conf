# --------------------#
#      Options        #
# --------------------#

# Setting Terminal Colors
set-option -g default-terminal tmux-256color
set -as terminal-features ",tmux-256color:RGB"

# Setting basic options
set -g mouse on
set -g set-clipboard on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# --------------------#
#      Keybinds       #
# --------------------#

# Setting prefix key
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Window split keybinds (opens in same directory as current pane)
unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Window navigation
bind-key -n C-S-h select-pane -L
bind-key -n C-S-j select-pane -D
bind-key -n C-S-k select-pane -U
bind-key -n C-S-l select-pane -R

# Alt+number to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Emacs style copying
bind-key -T copy-mode C-@ send -X begin-selection
bind-key -T copy-mode C-v   send -X rectangle-toggle
bind-key -T copy-mode M-w   send -X copy-selection-and-cancel

# ----------------------#
#      Status Bar       #
# ----------------------#
set -g mode-style "fg=#7aa2f7,bg=#3b4261"
set -g message-style "fg=#7aa2f7,bg=#3b4261"
set -g message-command-style "fg=#7aa2f7,bg=#3b4261"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g status "on"
set -g status-justify "left"
set -g status-style "fg=#7aa2f7,bg=#16161e"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "\
#{?client_prefix,#[bg=#ff9e64],#[bg=#7aa2f7]}\
#[fg=#15161e,bold]  #S \
#{?client_prefix,#[fg=#ff9e64],#[fg=#7aa2f7]}\
#[bg=#16161e,nobold,nounderscore,noitalics]"

set -g status-right "#[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#16161e] #{prefix_highlight} #[fg=#3b4261,bg=#16161e,nobold,nounderscore,noitalics]#[fg=#ff9e64,bg=#3b4261] 󰃭 %A %d %b   #(whoami) #[fg=#7aa2f7,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#15161e,bg=#7aa2f7,bold] 󰣇 #H "

setw -g window-status-activity-style "underscore,fg=#a9b1d6,bg=#16161e"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#a9b1d6,bg=#16161e"
setw -g window-status-format "#[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]#[default] #I  #W ✻ #[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#16161e,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#3b4261,bold] #I  #W #[fg=#ff9e64,bg=#3b4261,bold]◉ #[fg=#3b4261,bg=#16161e,nobold,nounderscore,noitalics]"
