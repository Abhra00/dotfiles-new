# A Simple yet elegant starship config
# Created by BUGS

# Schema
"$schema" = 'https://starship.rs/config-schema.json'

# Options
add_newline = true
command_timeout = 200

# Palette
palette = "Kintsukuroi"

# Prompt left format
format = """
$character$git_branch$git_status$directory[▓▒░ ](fg:bright_black)
"""

# Character
[character]
error_symbol = "[ 𜺰 ](bold bg:red fg:foreground_inverse)"
success_symbol = "[ λ ](bold bg:orange fg:foreground_inverse)"
vimcmd_symbol = "[ ▼ ](bold bg:green fg:foreground_inverse)"
vimcmd_visual_symbol = "[ ▼ ](bold bg:blue fg:foreground_inverse)"
vimcmd_replace_symbol = "[ ▼ ](bold bg:yellow fg:foreground_inverse)"
vimcmd_replace_one_symbol = "[ ▼ ](bold bg:magenta fg:foreground_inverse)"
format = "$symbol"

# Directory
[directory]
style = "bg:bright_black fg:bright_white"
read_only_style = "bg:bright_black fg:red"
home_symbol = "home"
read_only = " "
truncation_length = 2
truncation_symbol = "…/"
truncate_to_repo = false
format = "[ $path ]($style)[$read_only]($read_only_style)"

# Git branch
[git_branch]
style = "bg:bright_black fg:yellow"
symbol = " "
format = "[ $symbol$branch ]($style)"

# Git status
[git_status]
stashed = "≡"
up_to_date = "✦"
format = '[$all_status$ahead_behind]($style)'
style = "bg:bright_black fg:red"

# Kintsukuroi
[palettes.Kintsukuroi]
black = '#322d28'
red = '#c06c5c'
green = '#78997a'
yellow = '#c09d59'
blue = '#7f91b2'
magenta = '#b380b0'
cyan = '#7b9695'
white = '#d8be97'
bright_black = '#4d463e'
bright_red = '#d97a68'
bright_green = '#85b695'
bright_yellow = '#d8b164'
bright_blue = '#a3a9ce'
bright_magenta = '#cf9bc2'
bright_cyan = '#89b3b6'
bright_white = '#f2d5a9'
foreground = '#e5c9a0'
background = '#141210'
orange = '#d8834c'
foreground_inverse = '#141210'
